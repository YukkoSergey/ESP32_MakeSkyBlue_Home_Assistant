; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Two 1.9 MB app slots (OTA) instead of the default 1.25 MB. Changing the
; partition table needs one USB flash; after that OTA works.
board_build.partitions = min_spiffs.csv
build_flags =
    ; Default Arduino loop task stack is 8 KB — too tight once we're doing
    ; parallel HTTPS to Tuya (WiFiClientSecure/mbedTLS), JSON parsing and
    ; two PubSubClient loops in the same task. Bump to 16 KB.
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
build_src_filter = +<*> -<main_nodemcu.cpp> -<ota_min_nodemcu.cpp>


; Over-the-air upload to the board on the LAN:
;   DACHA_OTA_PASSWORD=<OTA_PASSWORD from secrets.h> pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = dacha-esp32.local
upload_flags =
    --auth=${sysenv.DACHA_OTA_PASSWORD}

; NodeMCU in the shed: relays only (see src/main_nodemcu.cpp).
;   pio run -e nodemcu -t upload            first time, over USB
[env:nodemcu]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; 4 MB flash: 1 MB sketch slot (+1 MB for OTA), rest LittleFS for settings.
board_build.ldscript = eagle.flash.4m2m.ld
; Red "2 Relay Module high/low level trigger" with S1/S2 jumpers on High.
build_flags = -DRELAY_ACTIVE_HIGH=1
    ; Heap guard bytes, checked on every malloc/free: catches a buffer overrun
    ; close to where it happens instead of minutes later in umm_split_block.
    -DUMM_POISON_CHECK
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
build_src_filter = -<*> +<compat.cpp> +<app_log.cpp> +<settings.cpp> +<relay_controller.cpp>
    +<alerts.cpp> +<ha_relays.cpp> +<web_ui.cpp> +<main_nodemcu.cpp>

;   DACHA_OTA_PASSWORD=<OTA_PASSWORD from secrets.h> pio run -e nodemcu_ota -t upload
[env:nodemcu_ota]
extends = env:nodemcu
upload_protocol = espota
upload_port = dacha-relays.local
upload_flags =
    --auth=${sysenv.DACHA_OTA_PASSWORD}

; Minimal NodeMCU image: relays released + WiFi + OTA. Flash once over USB,
; then send the full firmware with env:nodemcu_ota.
[env:nodemcu_bootstrap]
extends = env:nodemcu
build_src_filter = -<*> +<ota_min_nodemcu.cpp>
